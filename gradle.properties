# Project-wide Gradle settings
# https://docs.gradle.org/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# Increase heap if the project grows to include more modules.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# AndroidX package structure — mandatory for all new projects
android.useAndroidX=true

# Non-transitive R classes improve build speed in multi-module projects
android.nonTransitiveRClass=true

# Kotlin compiler configuration (not used here, but future-proofs the project)
kotlin.code.style=official
